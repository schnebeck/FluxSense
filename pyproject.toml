[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxsense"
version = "0.3.1"
description = "Semantic PDF analysis (classification, holistic extraction, plausibility) on local AI backends"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY.md"]
authors = [{ name = "Thorsten Schnebeck", email = "thorsten.schnebeck@gmx.net" }]
requires-python = ">=3.12"
keywords = ["pdf", "document-understanding", "invoice", "zugferd", "en16931", "llm", "vision-language-model", "ocr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: German",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "pikepdf>=8",
    "lxml>=5",
    "pillow>=10",
    "tomli-w>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
docling = ["docling>=2.40"]
dev = ["pytest>=8", "pytest-cov>=5", "respx>=0.21", "reportlab>=4"]

[project.urls]
Homepage = "https://github.com/schnebeck/FluxSense"
Repository = "https://github.com/schnebeck/FluxSense"
Issues = "https://github.com/schnebeck/FluxSense/issues"
Changelog = "https://github.com/schnebeck/FluxSense/blob/main/CHANGELOG.md"

[project.scripts]
fluxsense = "fluxsense.cli:main"

[tool.setuptools.packages.find]
include = ["fluxsense*"]

[tool.setuptools.package-data]
"fluxsense.data" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: tests against a real OpenAI-compatible backend (and docling-serve); run with -m live",
    "docling: tests that run the local Docling pipeline (slow, needs the docling extra)",
]
